<div class="p-6">
  <h1 class="text-3xl font-bold mb-8 text-white">Community Mitglieder</h1>

  @if (isLoading()) {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-green-500"></div>
    </div>
  } @else {
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-8">
@for (user of distinctUsers(); track user.username) {
  <div class="flex flex-col items-center group">
    <div class="relative mb-4">
      <div class="w-32 h-32 rounded-full bg-zinc-800 flex items-center justify-center text-4xl font-bold text-zinc-600">
        {{ user.username.charAt(0).toUpperCase() }}
      </div>
      
      <div class="absolute -right-2 -top-2 bg-green-600 text-white text-xs font-bold w-8 h-8 rounded-full flex items-center justify-center border-4 border-black">
        {{ user.count }}
      </div>
    </div>

    <h3 class="text-white font-bold text-lg">{{ user.username }}</h3>
  </div>
}
    </div>
  }
</div>
