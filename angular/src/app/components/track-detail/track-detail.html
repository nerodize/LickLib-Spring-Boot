@if (track(); as t) {
  <div class="p-8">
    <div class="flex items-end gap-6 mb-8">
      <div class="w-48 h-48 bg-zinc-800 shadow-2xl flex items-center justify-center text-6xl rounded-lg">
        🎸
      </div>
      <div>
        <span class="text-xs font-bold uppercase text-zinc-400">Track Details</span>
        <h1 class="text-6xl font-black text-white mt-2 mb-4">{{ t.title }}</h1>
        <p class="text-zinc-300 font-semibold">{{ t.artist }}</p>
      </div>
    </div>

    <div class="bg-black/20 rounded-xl p-6 border border-white/5">
      <div class="grid grid-cols-2 gap-y-4 max-w-md">
        <div class="text-zinc-500">Beschreibung:</div>
        <div class="text-white">{{ t.description || 'Keine Beschreibung vorhanden' }}</div>
        
        <div class="text-zinc-500">Dauer:</div>
        <div class="text-white">{{ t.duration }} Sekunden</div>
        
        <div class="text-zinc-500">Erstellt von:</div>
        <div class="text-green-500 font-bold">{{ t.username }}</div>
      </div>
    </div>

    <button routerLink="/tracks" class="mt-8 text-zinc-400 hover:text-white transition-colors">
      ← Zurück zur Übersicht
    </button>
  </div>
}
