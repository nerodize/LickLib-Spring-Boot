<div class="p-8 max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold text-white mb-8">Neuen Track hinzufügen</h1>

  <form [formGroup]="trackForm" (ngSubmit)="onSubmit()" class="space-y-6 bg-zinc-900 p-8 rounded-xl border border-white/5">
    
    <div>
      <label class="block text-zinc-400 text-sm font-bold mb-2">Titel</label>
      <input formControlName="title" type="text" 
             class="w-full bg-zinc-800 border border-transparent focus:border-green-500 outline-none text-white p-3 rounded-md transition-all">
    </div>

    <div>
      <label class="block text-zinc-400 text-sm font-bold mb-2">Artist</label>
      <input formControlName="artist" type="text"
             class="w-full bg-zinc-800 border border-transparent focus:border-green-500 outline-none text-white p-3 rounded-md transition-all">
    </div>

    <div>
      <label class="block text-zinc-400 text-sm font-bold mb-2">Dauer (Sekunden)</label>
      <input formControlName="duration" type="number"
             class="w-full bg-zinc-800 border border-transparent focus:border-green-500 outline-none text-white p-3 rounded-md transition-all">
    </div>

    <div>
      <label class="block text-zinc-400 text-sm font-bold mb-2">Beschreibung</label>
      <textarea formControlName="description" rows="3"
                class="w-full bg-zinc-800 border border-transparent focus:border-green-500 outline-none text-white p-3 rounded-md transition-all"></textarea>
    </div>

    <div class="flex justify-end gap-4 mt-8">
      <button type="button" (click)="trackForm.reset()" class="text-zinc-400 hover:text-white font-bold px-6 py-2">Abbrechen</button>
      <button type="submit" [disabled]="trackForm.invalid" 
              class="bg-green-500 hover:bg-green-400 disabled:bg-zinc-700 disabled:text-zinc-500 text-black font-bold px-8 py-3 rounded-full transition-all">
        Track speichern
      </button>
    </div>
  </form>
</div>
