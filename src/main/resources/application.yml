spring:
  docker:
    compose:
      enabled: false
      lifecycle-management: start-and-stop

  datasource:
    url: jdbc:postgresql://localhost:5432/licklib
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    check-location: true

debug: true

logging:
  level:
    org.flywaydb: DEBUG
